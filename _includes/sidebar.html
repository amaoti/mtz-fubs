<div class="sidebar">
    <h3>Table of Contents</h3>
    <ul>
      {% for heading in content | split: '<h2' %}
        {% if forloop.first == false %}
          {% assign heading_text = heading | split: '</h2>' | first | strip_html %}
          {% assign heading_id = heading_text | slugify %}
          <li><a href="#{{ heading_id }}">{{ heading_text }}</a></li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
